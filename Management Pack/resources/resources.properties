DISPLAY_NAME=VCF vCommunity Adapter

#The solution's localized description. Only <br> and <a> are used: keep it to those tags.
DESCRIPTION=VCF Operations already watches your vSphere estate, but it does not collect many of the ESXi and VM settings that matter for compliance, and it does not say whether a cluster can take more VMs. This Management Pack fills both gaps. It publishes what it finds on the vCenter objects you already monitor, under the vCommunity| prefix.<br><br>Why it helps:<br>• Catch configuration drift when it happens. A changed host setting, VM parameter or cluster setting becomes a property you can alert on, report on and check against a compliance template.<br>• Check your hardening guide or config workbook continuously, not only at the next audit.<br>• Answer capacity questions. Each cluster gets Cluster Performance, Cluster Risk and Cluster Consumption scores, and a Close for Business value that says whether it is full for new VMs.<br>• Explain every score. Each KPI is built from visible sub-metrics, so you can see which one is driving it.<br>• Stay agentless. Nothing is installed on ESXi hosts or on vCenter. Windows checks use the vSphere Guest API.<br><br>What it collects and calculates:<br>• ESXi advanced system settings, software packages (VIBs) and host licensing<br>• VM advanced parameters, VM options, disks and shares<br>• Cluster HA, DRS, DPM and EVC settings<br>• vCenter certificate tracking, with a status that shows when it changes<br>• Operational Availability and Network Speed Degradation<br>• KPIs for clusters, VMs and ESXi hosts, with a summary across all vCenters on the vSphere World object<br>• Optional Windows services and Windows event logs<br>• Dashboards, reports and super metrics, ready to use<br><br>You choose what is collected:<br>Each list of settings is an XML file. Clone it for each environment, and start with the few settings from your hardening guide. Add more over time, without a new release.<br><br>Before you start:<br>• Needs VCF Operations 8.18 or later, and a Cloud Proxy that can reach vCenter.<br>• Activate the packet counters and the NIC configured speed in the policy. They are off by default.<br>• Windows checks add load to VCF Operations and to each Windows VM. Turn them on selectively.<br><br>Read it together with <a href="https://isvara.io" target="_blank">isvara.io</a>, which complements this adapter. Both the content of isvara.io (metrics, dashboards, alerts, properties and more) and this adapter are documented in the Private Cloud Management book, 5th edition. Download it at <a href="https://isvara.io/download" target="_blank">isvara.io/download</a>.<br><br>This is a free community project. It is not an official VMware or Broadcom product, and it has no VMware GSS support. Deploy it at your own risk. Documentation and source code: <a href="https://github.com/e1-rahabok/VCF-vCommunity-Adapter" target="_blank">https://github.com/e1-rahabok/VCF-vCommunity-Adapter</a>

